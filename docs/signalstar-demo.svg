<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="320" role="img" aria-label="SignalStar Near-Field Sensing &amp; Automation Demo">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#132238"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1A73E8"/>
      <stop offset="100%" stop-color="#4DA3FF"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="320" rx="22" fill="url(#bgGrad)"/>

  <!-- Subtle Grid -->
  <g stroke="#1E3352" stroke-width="1" opacity="0.45">
    <line x1="0" y1="80" x2="900" y2="80"/>
    <line x1="0" y1="160" x2="900" y2="160"/>
    <line x1="0" y1="240" x2="900" y2="240"/>
    <line x1="225" y1="0" x2="225" y2="320"/>
    <line x1="450" y1="0" x2="450" y2="320"/>
    <line x1="675" y1="0" x2="675" y2="320"/>
  </g>

  <!-- Title Bar -->
  <text x="32" y="38" fill="#E2E8F0" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" font-weight="700">SignalStar · Near-Field Sensing Workflow</text>
  <rect x="708" y="18" width="164" height="26" rx="13" fill="#10B981" fill-opacity="0.16" stroke="#10B981" stroke-opacity="0.5"/>
  <text x="790" y="35" text-anchor="middle" fill="#34D399" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="600">0 INTERNET · 1.5 MB</text>

  <!-- Stage 1: Beacon / Wi-Fi AP -->
  <g transform="translate(120, 170)">
    <circle cx="0" cy="0" r="24" fill="#1A73E8" fill-opacity="0.2" stroke="#4DA3FF" stroke-width="2"/>
    <circle cx="0" cy="0" r="8" fill="#4DA3FF"/>
    <!-- Animated Radar Ripples -->
    <circle cx="0" cy="0" r="26" fill="none" stroke="#4DA3FF" stroke-width="2" opacity="0.8">
      <animate attributeName="r" values="26;78" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="26" fill="none" stroke="#4DA3FF" stroke-width="2" opacity="0.8">
      <animate attributeName="r" values="26;78" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="96" text-anchor="middle" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">BLE / Wi-Fi Signal</text>
    <text x="0" y="114" text-anchor="middle" fill="#64748B" font-family="monospace" font-size="11">Gate · iBeacon · AP</text>
  </g>

  <!-- Animated Signal Packet 1 -> 2 -->
  <line x1="205" y1="170" x2="315" y2="170" stroke="#334155" stroke-width="3" stroke-dasharray="6 6"/>
  <circle cx="205" cy="170" r="5" fill="#4DA3FF">
    <animate attributeName="cx" values="205;315" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="1.8s" repeatCount="indefinite"/>
  </circle>

  <!-- Stage 2: SignalStar Filter & Hysteresis Card -->
  <g transform="translate(325, 92)">
    <rect width="250" height="156" rx="20" fill="#162336" stroke="#2D4A73" stroke-width="1.5"/>
    <text x="20" y="30" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">SignalStar Engine</text>
    <text x="20" y="50" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11">RSSI Filter + 6 dBm Hysteresis</text>

    <!-- Threshold Line & Animated RSSI Bar -->
    <rect x="20" y="70" width="210" height="16" rx="8" fill="#0F172A"/>
    <rect x="20" y="70" width="90" height="16" rx="8" fill="url(#blueGrad)">
      <animate attributeName="width" values="70;185;185;70" keyTimes="0;0.45;0.75;1" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="fill" values="#3B82F6;#10B981;#10B981;#3B82F6" keyTimes="0;0.45;0.75;1" dur="4s" repeatCount="indefinite"/>
    </rect>
    <!-- Threshold marker -->
    <line x1="165" y1="64" x2="165" y2="92" stroke="#FBBF24" stroke-width="2"/>
    <text x="165" y="106" text-anchor="middle" fill="#FBBF24" font-family="monospace" font-size="10">Threshold ≥ -50 dBm</text>

    <!-- Status Pill -->
    <rect x="20" y="118" width="210" height="24" rx="12" fill="#10B981" fill-opacity="0.16">
      <animate attributeName="fill-opacity" values="0.08;0.25;0.25;0.08" keyTimes="0;0.45;0.75;1" dur="4s" repeatCount="indefinite"/>
    </rect>
    <text x="125" y="134" text-anchor="middle" fill="#34D399" font-family="monospace" font-size="11" font-weight="700">
      [Trigger: Gate_Near]
      <animate attributeName="opacity" values="0.35;1;1;0.35" keyTimes="0;0.45;0.75;1" dur="4s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Animated Trigger Pulse 2 -> 3 -->
  <line x1="585" y1="170" x2="675" y2="170" stroke="#334155" stroke-width="3" stroke-dasharray="6 6"/>
  <circle cx="585" cy="170" r="5" fill="#34D399">
    <animate attributeName="cx" values="585;675" dur="4s" begin="1.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="4s" begin="1.6s" repeatCount="indefinite"/>
  </circle>

  <!-- Stage 3: Routines / Tasker Automation -->
  <g transform="translate(685, 102)">
    <rect width="185" height="136" rx="20" fill="#162336" stroke="#10B981" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="92" y="34" text-anchor="middle" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Samsung Routines</text>
    <text x="92" y="52" text-anchor="middle" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Tasker / MacroDroid</text>

    <rect x="18" y="68" width="149" height="24" rx="8" fill="#1E293B"/>
    <text x="92" y="84" text-anchor="middle" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="11">⚡ Auto Open / Smart Home</text>

    <rect x="18" y="100" width="149" height="24" rx="8" fill="#0F172A"/>
    <text x="92" y="116" text-anchor="middle" fill="#34D399" font-family="system-ui, -apple-system, sans-serif" font-size="11">💤 Auto-Sleep (0% Drain)</text>
  </g>
</svg>
